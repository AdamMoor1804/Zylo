:root{--brand:#5FA0E0;--brand-dark:#4A8CC8;--brand-light:#E8F3FF;}
body{background:linear-gradient(135deg,#E8F3FF 0%,#C8E0FF 100%);display:flex;justify-content:center;min-height:100vh;padding:10px;}
#root{width:420px;}

.scroll{flex:1;overflow-y:auto;scrollbar-width:none;}
.scroll::-webkit-scrollbar{display:none;}

@keyframes bounceIn{0%{transform:scale(.2);opacity:0}55%{transform:scale(1.12)}78%{transform:scale(.95)}100%{transform:scale(1);opacity:1}}

.ov{position:absolute;inset:0;background:rgba(0,0,0,.58);display:flex;align-items:center;justify-content:center;z-index:900;backdrop-filter:blur(3px);}
.box{background:#fff;border-radius:28px;padding:22px 20px;width:93%;max-width:350px;animation:bounceIn .42s cubic-bezier(.34,1.56,.64,1);}
.toast-el{position:absolute;top:13px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:#fff;padding:8px 20px;border-radius:40px;font-weight:800;font-size:12px;white-space:nowrap;z-index:999;pointer-events:none;animation:toastIn .2s ease;}
.nb{flex:1;border:none;background:none;cursor:pointer;padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;}
.cp{position:absolute;border-radius:3px;animation:fall 1.4s ease-in forwards;}

const tod=()=>new Date().toISOString().split("T")[0];
const yest=()=>new Date(Date.now()-86400000).toISOString().split("T")[0];
const getRank=xp=>{let r=RANKS[0];for(const x of RANKS)if(xp>=x.xpReq)r=x;return r;};
const getRankIdx=xp=>{let i=0;RANKS.forEach((r,j)=>{if(xp>=r.xpReq)i=j;});return i;};
const getPct=xp=>{const r=getRank(xp);if(!r.next)return 100;return Math.min(100,Math.round((xp-r.xpReq)/(r.next-r.xpReq)*100));};
const hashStr=s=>{let h=0;for(let i=0;i<s.length;i++){h=Math.imul(31,h)+s.charCodeAt(i)|0;}return Math.abs(h);};
const seededRand=(seed)=>{let s=seed;return()=>{s=(s*16807+0)%2147483647;return(s-1)/2147483646;};};
const getDailyQuests=()=>{const d=tod();const r=seededRand(hashStr(d));const shuffled=[...QUEST_POOL].sort(()=>r()-.5);return shuffled.slice(0,3);};

/* ─── FIREBASE DB HELPERS ─── */
const fbRef = path => db.ref(path);

const saveUserToDb = async (username, data) => {
  const u = username.toLowerCase();
  await fbRef("users/" + u).update({
    username: u,
    displayName: data.displayName || u,
    avatar: data.avatar || "🦉",
    xp: data.xp || 0,
    streak: data.streak || 0,
    rank: getRank(data.xp || 0).name,
    rankIcon: getRank(data.xp || 0).icon,
    lastSeen: Date.now(),
  });
};

const saveFullProfile = async (username, data) => {
  const u = username.toLowerCase();
  // Save full game state (private node)
  await fbRef("profiles/" + u).set({...data, username: u});
  // Save public summary
  await saveUserToDb(u, data);
};

const loadFullProfile = async (username) => {
  const u = username.toLowerCase();
  const snap = await fbRef("profiles/" + u).get();
  return snap.exists() ? snap.val() : null;
};

const getUserFromDb = async (username) => {
  const snap = await fbRef("users/" + username.toLowerCase()).get();
  return snap.exists() ? snap.val() : null;
};

  await fbRef("incomingRequests/" + to + "/" + from).set(reqData);
};

const syncIncomingRequests = async (username) => {
  const snap = await fbRef("incomingRequests/" + username.toLowerCase()).get();
  if (!snap.exists()) return [];
  return Object.values(snap.val());
};

const clearIncomingRequest = async (toUsername, fromUsername) => {
  await fbRef("incomingRequests/" + toUsername.toLowerCase() + "/" + fromUsername.toLowerCase()).remove();
};

// Friend challenge helpers
const sendChallenge = async (fromUser, fromData, toUsername, task, reward) => {
  const to = toUsername.toLowerCase();
  const chalData = {
    id: Date.now(),
    from: fromUser.toLowerCase(),
    fromDisplay: fromData.displayName || fromUser,
    fromAvatar: fromData.avatar || "🦉",
    task,
    reward,
    sentAt: Date.now(),
  };
  await fbRef("challenges/" + to + "/" + chalData.id).set(chalData);
};

const syncChallenges = async (username) => {
  const snap = await fbRef("challenges/" + username.toLowerCase()).get();
  if (!snap.exists()) return [];
  return Object.values(snap.val());
};

const resolveChallenge = async (challengeId, receiverUsername, challengerUsername, reward, accept) => {
  // Remove challenge node
  await fbRef("challenges/" + receiverUsername.toLowerCase() + "/" + challengeId).remove();
  if (accept) {
    // Deduct coins from challenger in Firebase
    const chalSnap = await fbRef("profiles/" + challengerUsername.toLowerCase()).get();
    if (chalSnap.exists()) {
      const chalData = chalSnap.val();
      const newChalCoins = Math.max(0, (chalData.coins || 0) - reward);
      await fbRef("profiles/" + challengerUsername.toLowerCase() + "/coins").set(newChalCoins);
    }
    // Add coins to receiver in Firebase
    const recSnap = await fbRef("profiles/" + receiverUsername.toLowerCase()).get();
    if (recSnap.exists()) {
      const recData = recSnap.val();
      const newRecCoins = (recData.coins || 0) + reward;
      await fbRef("profiles/" + receiverUsername.toLowerCase() + "/coins").set(newRecCoins);
    }
  }
};

// Password stored in Firebase (hashed) so login works on any device
const savePassword = async (username, pw) => {
  await fbRef("passwords/" + username.toLowerCase()).set(String(hashStr(pw + username.toLowerCase())));
};
const checkPassword = async (username, pw) => {
  const snap = await fbRef("passwords/" + username.toLowerCase()).get();
  if (!snap.exists()) return false;
  return snap.val() === String(hashStr(pw + username.toLowerCase()));
};
const userExists = async (username) => {
  const snap = await fbRef("users/" + username.toLowerCase()).get();
  return snap.exists();
};

/* ─── CONFETTI ─── */
function Confetti(){
  const p=Array.from({length:28},(_,i)=>({id:i,col:CF[i%CF.length],left:3+Math.random()*94,delay:Math.random()*.8,sz:7+Math.random()*8,round:i%3===0}));
  return <div style={{position:"absolute",inset:0,pointerEvents:"none",overflow:"hidden",zIndex:5}}>
    {p.map(x=><div key={x.id} className="cp" style={{left:`${x.left}%`,top:0,width:x.sz,height:x.sz,background:x.col,borderRadius:x.round?"50%":"3px",animationDelay:`${x.delay}s`}}/>)}
  </div>;
}

/* ─── RANK UP MODAL with screen flash + shake ─── */
function RankUpModal({rank,onClose}){
  return <>
    {/* Full screen colour flash */}
    <div style={{position:"absolute",inset:0,background:rank.col,zIndex:850,animation:"flashFade 1.5s ease forwards",pointerEvents:"none",opacity:.7}}/>
    {/* Shake wrapper */}
    <div style={{position:"absolute",inset:0,animation:"shake .6s ease .1s",zIndex:860,display:"flex",alignItems:"center",justifyContent:"center"}}>
      <Confetti/>
      <div style={{background:rank.bg,border:`3px solid ${rank.col}`,borderRadius:28,padding:"24px 22px",width:"88%",maxWidth:340,textAlign:"center",overflow:"hidden",boxShadow:`0 0 60px ${rank.col}88`}}>
        <div style={{fontSize:11,fontWeight:800,color:rank.col,letterSpacing:3,marginBottom:4}}>RANK UP!</div>
        <div style={{fontSize:82,lineHeight:1.1,margin:"8px 0 6px",animation:"floaty 1.6s ease-in-out infinite"}}>{rank.icon}</div>
        <div style={{fontSize:27,fontWeight:900,color:rank.col,letterSpacing:"-.5px"}}>{rank.name}</div>
        <div style={{display:"flex",justifyContent:"center",gap:7,margin:"10px 0"}}>
          {[0,1,2].map(i=><span key={i} style={{fontSize:24,animation:`popStar .4s ease ${.3+i*.13}s both`}}>⭐</span>)}
        </div>
        <div style={{fontSize:13,color:"#666",fontWeight:700,marginBottom:16}}>You are absolutely smashing it! 🎉</div>
        <button onClick={onClose} style={{background:rank.col,border:"none",borderRadius:16,padding:"13px 38px",fontFamily:"Nunito,sans-serif",fontWeight:900,fontSize:15,color:"#fff",cursor:"pointer",boxShadow:`0 5px 0 ${rank.col}BB`}}>AMAZING! 🎊</button>
      </div>
    </div>
  </>;
}

/* ─── TIER REWARD MODAL ─── */
function TierRewardModal({tier,reward,onClose}){
  const col=RANKS.find(r=>r.tier===tier)?.col||"#5FA0E0";
  const bg=RANKS.find(r=>r.tier===tier)?.bg||"#E8F3FF";
  return <>
    <div style={{position:"absolute",inset:0,background:col,zIndex:850,animation:"flashFade 2s ease forwards",pointerEvents:"none"}}/>
    <div style={{position:"absolute",inset:0,animation:"shake .5s ease .2s",zIndex:860,display:"flex",alignItems:"center",justifyContent:"center"}}>
      <Confetti/>
      <div style={{background:bg,border:`3px solid ${col}`,borderRadius:28,padding:"26px 22px",width:"90%",maxWidth:340,textAlign:"center",boxShadow:`0 0 80px ${col}99`}}>
        <div style={{fontSize:12,fontWeight:800,color:col,letterSpacing:3,marginBottom:6}}>TIER COMPLETE!</div>
        <div style={{fontSize:60,margin:"8px 0",animation:"zoomIn .5s ease both"}}>🎁</div>
        <div style={{fontSize:20,fontWeight:900,color:col,marginBottom:6}}>Tier Cosmetics Unlocked!</div>
        <div style={{display:"flex",gap:10,justifyContent:"center",margin:"14px 0"}}>
          <div style={{background:reward.char.bg,border:`2px solid ${reward.char.bdr}`,borderRadius:16,padding:"12px",textAlign:"center",flex:1}}>
            <div style={{fontSize:32}}>{reward.char.ico}</div>
            <div style={{fontSize:10,fontWeight:800,color:col,marginTop:4}}>{reward.char.name}</div>
            <div style={{fontSize:9,color:"#888",fontWeight:600}}>Character</div>
          </div>
          <div style={{background:reward.bg.col,border:`2px solid ${col}`,borderRadius:16,padding:"12px",textAlign:"center",flex:1}}>
            <div style={{fontSize:32}}>{reward.bg.ico}</div>
            <div style={{fontSize:10,fontWeight:800,color:col,marginTop:4}}>{reward.bg.name}</div>
            <div style={{fontSize:9,color:"#888",fontWeight:600}}>Theme</div>
          </div>
        </div>
        <div style={{fontSize:12,color:"#888",fontWeight:600,marginBottom:14}}>Check your Shop to equip them!</div>
        <button onClick={onClose} style={{background:col,border:"none",borderRadius:14,padding:"12px 32px",fontFamily:"Nunito,sans-serif",fontWeight:900,fontSize:14,color:"#fff",cursor:"pointer",boxShadow:`0 4px 0 ${col}AA`}}>AWESOME! 🎉</button>
      </div>
    </div>
  </>;
}

/* ─── STREAK MILESTONE ANIMATION ─── */
function StreakFlash({milestone,onDone}){
  useEffect(()=>{const t=setTimeout(onDone,3200);return()=>clearTimeout(t);},[]);
  const col=milestone.ico==="🔥"?"#FF6B35":milestone.ico==="💎"?"#00ACC1":milestone.ico==="⭐"?"#F9A825":milestone.ico==="🏆"?"#CD7F32":"#5FA0E0";
  return <div style={{position:"absolute",inset:0,zIndex:980,display:"flex",alignItems:"center",justifyContent:"center",overflow:"hidden"}}>
    {/* Full colour background that fades */}
    <div style={{position:"absolute",inset:0,background:col,animation:"flashFade 3s ease forwards"}}/>
    {/* Shake + content */}
    <div style={{position:"relative",zIndex:2,textAlign:"center",animation:"shake .5s ease .1s, streakFlash 3s ease forwards"}}>
      <Confetti/>
      <div style={{fontSize:90,lineHeight:1,marginBottom:10,filter:"drop-shadow(0 4px 16px rgba(0,0,0,.3))"}}>
        {milestone.ico}
      </div>
      <div style={{fontSize:16,fontWeight:900,color:"#fff",letterSpacing:3,textShadow:"0 2px 8px rgba(0,0,0,.4)",marginBottom:6}}>
        STREAK MILESTONE!
      </div>
      <div style={{fontSize:38,fontWeight:900,color:"#fff",textShadow:"0 2px 12px rgba(0,0,0,.4)",marginBottom:4}}>
        {milestone.days} DAYS! 🔥
      </div>
      <div style={{fontSize:18,fontWeight:800,color:"rgba(255,255,255,.9)",textShadow:"0 2px 8px rgba(0,0,0,.3)"}}>
        +{milestone.reward}
      </div>
    </div>
  </div>;
}

/* ─── CHEST OPENING ANIMATION ─── */
function ChestOpening({coins,bonus,onDone}){
  const[phase,setPhase]=useState(0); // 0=intro, 1=open, 2=done
  const BMAP={freeze:"🧊 Streak Freeze",xp_boost:"⚡ XP Boost",chest_key:"🗝️ Bonus Chest",xp_cap:"📈 XP Cap Up"};
  useEffect(()=>{
    const t1=setTimeout(()=>setPhase(1),1000);
    const t2=setTimeout(()=>setPhase(2),2200);
    return()=>{clearTimeout(t1);clearTimeout(t2);};
  },[]);
  return <div className="ov" style={{zIndex:980}}>
    {phase===0&&<div style={{textAlign:"center",animation:"slideUp .4s ease"}}>
      <div style={{fontSize:26,fontWeight:900,color:"#fff",letterSpacing:"-1px",marginBottom:4,textShadow:"0 2px 12px rgba(0,0,0,.4)"}}>zylo.</div>
      <div style={{fontSize:14,fontWeight:700,color:"rgba(255,255,255,.85)",textShadow:"0 1px 6px rgba(0,0,0,.3)"}}>Get things done and level up your day!</div>
    </div>}
    {phase===1&&<div style={{textAlign:"center"}}>
      <div style={{fontSize:80,animation:"chestOpen .8s ease infinite",filter:"drop-shadow(0 8px 20px rgba(0,0,0,.4))"}}>📦</div>
      <div style={{fontSize:14,fontWeight:800,color:"#fff",marginTop:12,letterSpacing:2}}>OPENING...</div>
    </div>}
    {phase===2&&<div className="box" style={{background:"#FFFDE7",border:"3px solid #F9A825",textAlign:"center"}}>
      <Confetti/>
      <div style={{fontSize:66,animation:"floaty 1s ease-in-out infinite"}}>🎁</div>
      <div style={{fontSize:11,fontWeight:800,color:"#F9A825",letterSpacing:3,marginTop:8}}>CHEST OPENED!</div>
      <div style={{fontSize:40,fontWeight:900,color:"#F9A825",lineHeight:1.1,marginTop:6}}>+{coins}</div>
      <div style={{fontSize:14,fontWeight:700,color:"#aaa",marginBottom:8}}>coins 🪙</div>
      {bonus&&<div style={{background:"#E8F3FF",border:"2px solid #5FA0E0",borderRadius:14,padding:"9px 14px",margin:"6px 0 10px",fontWeight:800,fontSize:14,color:"#1565C0"}}>🎁 BONUS: {BMAP[bonus]}!</div>}
      <div style={{fontSize:12,color:"#bbb",fontWeight:600,marginBottom:12}}>{bonus?"Lucky drop! 🍀":"Opens again at midnight!"}</div>
      <button onClick={onDone} style={{background:"#F9A825",border:"none",borderRadius:14,padding:"11px 30px",fontFamily:"Nunito,sans-serif",fontWeight:900,fontSize:14,color:"#fff",cursor:"pointer",boxShadow:"0 4px 0 #E09000"}}>NICE! 😄</button>
    </div>}
  </div>;
}

/* ─── CONFIRM PURCHASE MODAL ─── */
function ConfirmModal({item,onConfirm,onCancel,coins}){
  const canAfford=coins>=item.price;
  return <div className="ov" style={{zIndex:950}}>
    <div className="box" style={{border:"2.5px solid #5FA0E0",textAlign:"center"}}>
      <div style={{fontSize:48,marginBottom:12}}>{item.ico||"🛒"}</div>
      <div style={{fontSize:16,fontWeight:900,color:"#1A1A2E",marginBottom:6}}>Confirm Purchase</div>
      <div style={{fontSize:14,fontWeight:800,color:"#333",marginBottom:4}}>{item.name}</div>
      <div style={{fontSize:12,color:"#888",fontWeight:600,marginBottom:14}}>{item.desc}</div>
      <div style={{background:"#E8F3FF",border:"2px solid #5FA0E0",borderRadius:12,padding:"10px",marginBottom:16,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
        <span style={{fontSize:18}}>🪙</span>
        <span style={{fontWeight:900,fontSize:18,color:"#5FA0E0"}}>{item.price} coins</span>
        <span style={{fontSize:12,color:"#aaa",fontWeight:600}}>/ You have {coins}</span>
      </div>

/* ─── LOGIN SCREEN ─── */
function LoginScreen({onLogin}){
  const[mode,setMode]=useState("login");
  const[uname,setUname]=useState("");
  const[dname,setDname]=useState("");
  const[pw,setPw]=useState("");
  const[err,setErr]=useState("");
  const[loading,setLoading]=useState(false);
  const handle=async()=>{
    setErr("");
    const u=uname.trim().toLowerCase();
    if(!u||u.length<3){setErr("Username must be at least 3 characters");return;}
    if(!/^[a-z0-9_]+$/.test(u)){setErr("Only letters, numbers and _ allowed");return;}
    if(!pw||pw.length<4){setErr("Password must be at least 4 characters");return;}
    setLoading(true);
    try{
      if(mode==="register"){
        const exists=await userExists(u);
        if(exists){setErr("Username taken! Try another.");setLoading(false);return;}
        const nd={...DEF,username:u,displayName:dname.trim()||u};
        await savePassword(u,pw);
        await saveFullProfile(u,nd);
        onLogin(u,nd);
      }else{
        const exists=await userExists(u);
        if(!exists){setErr("Username not found. Sign up first!");setLoading(false);return;}
        const ok=await checkPassword(u,pw);
        if(!ok){setErr("Wrong password!");setLoading(false);return;}
        const saved=await loadFullProfile(u);
        onLogin(u,saved?{...DEF,...saved}:DEF);
      }
    }catch(e){setErr("Connection error. Check your internet.");setLoading(false);}
  };
  return <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#E8F3FF,#C8E0FF)",display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
    <div style={{width:"100%",maxWidth:380,background:"#fff",borderRadius:28,padding:"32px 24px",boxShadow:"0 20px 60px rgba(95,160,224,.25)",border:"2px solid #C8DCF5"}}>
      <div style={{textAlign:"center",marginBottom:28}}>
        <img src={LOGO_SRC} alt="zylo" style={{width:100,height:100,borderRadius:22,margin:"0 auto 8px",display:"block"}}/>
        <div style={{fontSize:13,color:"#888",fontWeight:700,marginTop:2}}>Get things done and level up your day!</div>
      </div>
      <div style={{display:"flex",background:"#F4F8FF",borderRadius:14,padding:4,marginBottom:20,gap:4}}>
        {["login","register"].map(m=><button key={m} onClick={()=>{setMode(m);setErr("");}} style={{flex:1,padding:"9px",border:"none",borderRadius:11,fontFamily:"Nunito,sans-serif",fontWeight:800,fontSize:13,cursor:"pointer",background:mode===m?"#5FA0E0":"transparent",color:mode===m?"#fff":"#888",transition:"all .2s"}}>{m==="login"?"Log In":"Sign Up"}</button>)}
      </div>
      {err&&<div style={{background:"#FFF0F0",border:"2px solid #FFAAAA",borderRadius:12,padding:"8px 12px",fontSize:12,fontWeight:700,color:"#CC3333",marginBottom:14,textAlign:"center"}}>{err}</div>}
      <div style={{marginBottom:12}}>
        <div style={{fontSize:10,fontWeight:800,color:"#AAA",letterSpacing:".8px",marginBottom:6}}>USERNAME</div>
        <input className="input-field" value={uname} onChange={e=>setUname(e.target.value.toLowerCase().replace(/[^a-z0-9_]/g,""))} placeholder="your_username" maxLength={20} onKeyDown={e=>e.key==="Enter"&&handle()}/>
      </div>
      {mode==="register"&&<div style={{marginBottom:12}}>
        <div style={{fontSize:10,fontWeight:800,color:"#AAA",letterSpacing:".8px",marginBottom:6}}>DISPLAY NAME <span style={{fontWeight:600,color:"#CCC"}}>(optional)</span></div>
        <input className="input-field" value={dname} onChange={e=>setDname(e.target.value)} placeholder="Your Name" maxLength={24} onKeyDown={e=>e.key==="Enter"&&handle()}/>
      </div>}
      <div style={{marginBottom:20}}>
        <div style={{fontSize:10,fontWeight:800,color:"#AAA",letterSpacing:".8px",marginBottom:6}}>PASSWORD</div>
        <input className="input-field" type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="••••••••" onKeyDown={e=>e.key==="Enter"&&handle()}/>
      </div>
      <button className="brand-btn" onClick={handle} disabled={loading} style={{opacity:loading?.7:1}}>
        {loading?"⏳ Please wait...":mode==="login"?"Log In 🚀":"Create Account ✨"}
      </button>
      <div style={{textAlign:"center",marginTop:14,fontSize:11,color:"#AAA",fontWeight:700}}>
        {mode==="login"?"No account? ":"Have an account? "}
        <span onClick={()=>{setMode(mode==="login"?"register":"login");setErr("");}} style={{color:"#5FA0E0",cursor:"pointer",fontWeight:800}}>{mode==="login"?"Sign up free":"Log in"}</span>
      </div>
    </div>
  </div>;
}

    <img src={LOGO_SRC} alt="zylo" style={{width:110,height:110,borderRadius:24,marginBottom:28,display:"block",animation:"zsplash .6s ease both"}}/>
    <div style={{display:"flex",gap:10,flexWrap:"wrap",justifyContent:"center"}}>
      {["Zylo,","get","things","done","and","level","up","your","day!"].map((word,i)=><span key={i} style={{fontSize:i===0?28:22,fontWeight:900,color:"#fff",animation:`splashword .5s ease ${.15+i*.1}s both`,opacity:0,letterSpacing:i===0?"-1px":"-.3px"}}>{word}</span>)}
    </div>

  const tc2=dk?"#8080A0":"#72728A";
  const cardBg=dk?"#16162A":"#FFFFFF";

  const pct=getPct(s.xp);

  const eqChar=CHARS.find(c=>c.id===s.equippedChar&&(s.ownedChar||["owl"]).includes(c.id))||CHARS.find(c=>c.id==="owl")||CHARS[0];
  const eqFrame=FRAMES.find(f=>f.id===s.equippedFrame)||FRAMES[0];

  const atCap=todayXp>=dailyCap;
  const earnXp=s.xpBoost>0?XP_EACH*2:XP_EACH;

  const th={acc:bg.acc,tc,tc2,dk,cardBg,cardBdr};

    for(const[tier,reward] of Object.entries(TIER_REWARDS)){
      const triggerRank=RANKS.find(r=>r.name===reward.triggerRank);
      if(!triggerRank)continue;
      if(prevXp<triggerRank.xpReq&&newXp>=triggerRank.xpReq&&!(alreadyClaimed||[]).includes(tier)){

      }

    return null;
  };

  const addTask=()=>{
    if(!inp.trim())return;
    const task={id:Date.now(),text:inp.trim(),done:false};

      const dt=dueTime?new Date(dueDate+"T"+dueTime):new Date(dueDate+"T23:59");

  };

  const completeTask=async id=>{
    const task=s.dailyTasks.find(t=>t.id===id);
    if(!task||task.done)return;
    // no flash delay
    const prevIdx=getRankIdx(s.xp);
    const today=tod();
    const curXp=s.dailyXpDate===today?s.dailyXpEarned:0;

    let streak=s.streak,lsd=s.lastStreakDate;

    const nb=s.xpBoost>0&&earned>0?s.xpBoost-1:s.xpBoost;
    const currentClaimed=s.claimedTierRewards||[];
    const tierRew=checkTierReward(newXp,s.xp,currentClaimed);
    const patch={dailyTasks:tasks,xp:newXp,streak,lastStreakDate:lsd,totalDone:s.totalDone+1,dailyXpEarned:curXp+earned,dailyXpDate:today,xpBoost:nb};
    if(tierRew){
      patch.claimedTierRewards=[...currentClaimed,tierRew.tier];
      const newOwnedChar=(s.ownedChar||["owl"]).includes(tierRew.reward.char.id)?s.ownedChar:[...(s.ownedChar||["owl"]),tierRew.reward.char.id];

      patch.ownedChar=newOwnedChar;
      patch.ownedBg=newOwnedBg;
    }
    upd(patch);
    setFadingTask(id);
    setTimeout(()=>{
      setFadingTask(null);

    if(newIdx>prevIdx){
      setLvlRank(RANKS[newIdx]);
      setModal("lvl");
      if(tierRew)setTimeout(()=>{setModal(null);setTierRewardData(tierRew);},3500);

      setTierRewardData(tierRew);

    else if(nb!==s.xpBoost)showToast(`+${earned} XP ⚡ BOOSTED!`);
    else showToast(`+${earned} XP ⚡`);
  };

  const completeQuest=(idx)=>{
    const newDone=[...questsDone];
    if(newDone.includes(idx))return;
    newDone.push(idx);
    const coins=s.coins+25;
    upd({dailyQuestDate:tod(),dailyQuestsDone:newDone,coins});
    showToast("+25 coins! 🪙 Quest complete!");
  };

  const openChest=()=>{
    if(!chestAvail){showToast("Come back tomorrow! 📦");return;}
    const coins=50+Math.floor(Math.random()*101);
    const roll=Math.random();
    let bonus=null;
    if(roll<.10)bonus="freeze";else if(roll<.18)bonus="xp_boost";else if(roll<.23)bonus="chest_key";else if(roll<.27)bonus="xp_cap";
    const patch={coins:s.coins+coins,lastChestDate:tod()};
    if(bonus==="freeze")patch.streakFreezes=(s.streakFreezes||0)+1;
    if(bonus==="xp_boost")patch.xpBoost=(s.xpBoost||0)+10;
    if(bonus==="xp_cap")patch.xpCapBonuses=(s.xpCapBonuses||0)+1;
    upd(patch);setChestOpenData({coins,bonus});
  };

  const claimMS=m=>{
    if(s.streak<m.days||s.claimedMS.includes(m.days))return;
    upd({coins:s.coins+m.coins,claimedMS:[...s.claimedMS,m.days]});
    setStreakFlashData(m);
  };

  /* Purchase flow with confirm */
  const requestBuy=(item,cat)=>{
    if(cat==="util"&&item.id==="chest_key"){doBuy(item,cat);return;}
    const OK={chars:"ownedChar",bgs:"ownedBg",frames:"ownedFrame"};
    if(cat!=="util"&&s[OK[cat]]?.includes(item.id)){doBuy(item,cat);return;}// just equip
    if(item.price===0&&!item.tierReward){doBuy(item,cat);return;}
    if(item.tierReward){showToast("Unlock this by reaching that rank! 🏆");return;}
    setConfirmItem(item);setPendingBuy(()=>()=>doBuy(item,cat));
  };

  const doBuy=(item,cat)=>{
    setConfirmItem(null);setPendingBuy(null);
    if(cat==="util"){
      if(s.coins<item.price){showToast("Not enough coins! 🪙");return;}
      if(item.id==="chest_key"){const c=100+Math.floor(Math.random()*151);upd({coins:s.coins-item.price+c});setChestOpenData({coins:c,bonus:null});return;}
      const patch={coins:s.coins-item.price};
      if(item.id==="freeze")patch.streakFreezes=(s.streakFreezes||0)+1;
      if(item.id==="xp_boost")patch.xpBoost=(s.xpBoost||0)+10;
      if(item.id==="xp_cap")patch.xpCapBonuses=(s.xpCapBonuses||0)+1;
      upd(patch);showToast(`Got ${item.name}! 🎉`);return;
    }
    const OK={chars:"ownedChar",bgs:"ownedBg",frames:"ownedFrame"};
    const EK={chars:"equippedChar",bgs:"equippedBg",frames:"equippedFrame"};
    const oa=s[OK[cat]]||[];
    if(s[EK[cat]]===item.id)return;
    if(oa.includes(item.id)){upd({[EK[cat]]:item.id});showToast(`Equipped ${item.name}! ✨`);return;}
    if(item.tierReward){showToast("Unlock this by ranking up!");return;}
    if(s.coins<item.price){showToast("Not enough coins! 🔒");return;}
    upd({coins:s.coins-item.price,[OK[cat]]:[...oa,item.id],[EK[cat]]:item.id});showToast(`Unlocked ${item.name}! 🎉`);
  };

  const addFriend=async()=>{
    if(!friendResult)return;
    const u=friendResult.username;
    if((s.friends||[]).find(f=>f.username===u)){showToast("Already friends! 👥");return;}
    if((s.pendingRequests||[]).find(r=>r===u)){showToast("Request already sent! ⏳");return;}
    await sendFriendRequest(currentUser,s,u);
    upd({pendingRequests:[...(s.pendingRequests||[]),u]});
    showToast(`Friend request sent to ${friendResult.displayName||u}! 📨`);
    setFriendSearch("");setFriendResult(null);setFriendSearched(false);
  };
  const acceptFriend=async(requester)=>{
    // Remove the incoming request node
    await clearIncomingRequest(currentUser,requester.username);

    // Build my public profile summary to send to them
    const myEntry={
      username:currentUser,
      displayName:s.displayName||currentUser,
      avatar:s.avatar||"🦉",
      xp:s.xp||0,
      streak:s.streak||0,
      rank:getRank(s.xp||0).name,
      rankIcon:getRank(s.xp||0).icon,
      lastSeen:Date.now(),
    };

    // Add each other to each other's friends list in Firebase
    const mySnap=await fbRef("profiles/"+currentUser.toLowerCase()).get();
    if(mySnap.exists()){
      const myData=mySnap.val();
      const myFriends=[...(myData.friends||[])];
      if(!myFriends.find(f=>f.username===requester.username))myFriends.push(requester);
      await fbRef("profiles/"+currentUser.toLowerCase()+"/friends").set(myFriends);
    }

    // Add me to the OTHER person's friends list in Firebase
    const theirSnap=await fbRef("profiles/"+requester.username.toLowerCase()).get();
    if(theirSnap.exists()){
      const theirData=theirSnap.val();
      const theirFriends=[...(theirData.friends||[])];
      if(!theirFriends.find(f=>f.username===currentUser))theirFriends.push(myEntry);
      // Also remove me from their pendingRequests
      const theirPending=(theirData.pendingRequests||[]).filter(r=>r!==currentUser);
      await fbRef("profiles/"+requester.username.toLowerCase()+"/friends").set(theirFriends);
      await fbRef("profiles/"+requester.username.toLowerCase()+"/pendingRequests").set(theirPending);
    }

    // Update local state
    upd({
      friends:[...(s.friends||[]),requester],
      incomingRequests:(s.incomingRequests||[]).filter(r=>r.username!==requester.username),
      pendingRequests:(s.pendingRequests||[]).filter(r=>r!==requester.username),
    });
    showToast(`You and ${requester.displayName||requester.username} are now friends! 🎉`);
  };
  const declineFriend=(requesterUsername)=>{
    clearIncomingRequest(currentUser,requesterUsername);

  };
  const syncRequests=async()=>{
    const fresh=await syncIncomingRequests(currentUser);

    const freshProfile=await loadFullProfile(currentUser);
    const patch={};
    if(JSON.stringify(fresh)!==JSON.stringify(s.incomingRequests||[]))patch.incomingRequests=fresh;
    if(JSON.stringify(freshChals)!==JSON.stringify(s.challenges||[]))patch.challenges=freshChals;
    if(freshProfile){
      if(JSON.stringify(freshProfile.friends||[])!==JSON.stringify(s.friends||[]))patch.friends=freshProfile.friends||[];
      if(JSON.stringify(freshProfile.pendingRequests||[])!==JSON.stringify(s.pendingRequests||[]))patch.pendingRequests=freshProfile.pendingRequests||[];
    }
    if(Object.keys(patch).length>0)upd(patch);
  };

  const searchFriend=async()=>{

      {Array.from({length:80},(_,i)=>{
        const seed=(i*2654435761)>>>0;
        const x=((seed&0xFF)/255)*100;
        const y=(((seed>>8)&0xFF)/255)*100;
        const size=((seed>>16)&3)===0?2:((seed>>16)&3)===1?1.5:1;
        const opacity=0.4+((seed>>20)&0x3F)/100;
        const delay=((seed>>24)&0xFF)/25;
        return <div key={i} style={{position:"absolute",left:`${x}%`,top:`${y}%`,width:size,height:size,borderRadius:"50%",background:"#fff",opacity,animation:`shimmer ${2+delay}s ease-in-out infinite`,animationDelay:`${delay}s`}}/>;

        <div style={{fontSize:10,fontWeight:800,color:"#AAA",letterSpacing:".8px",marginBottom:5}}>YOUR COIN REWARD ({s.coins} available)</div>

          {[25,50,100,200].map(amt=><button key={amt} onClick={()=>setChallengeReward(amt)} style={{flex:1,padding:"8px 0",border:`2px solid ${challengeReward===amt?"#5FA0E0":"#E0E0E0"}`,borderRadius:10,fontFamily:"Nunito,sans-serif",fontWeight:800,fontSize:12,background:challengeReward===amt?"#E8F3FF":"#fff",color:challengeReward===amt?"#5FA0E0":"#888",cursor:"pointer"}}>🪙{amt}</button>)}

        {challengeReward>s.coins&&<div style={{background:"#FFF0F0",border:"2px solid #FFCDD2",borderRadius:10,padding:"7px",fontSize:11,fontWeight:700,color:"#C62828",marginBottom:10,textAlign:"center"}}>Not enough coins!</div>}
        <div style={{background:"#E8F3FF",border:"2px solid #A0C8F0",borderRadius:12,padding:"10px 12px",fontSize:11,fontWeight:700,color:"#1565C0",marginBottom:14}}>
          ✅ If they complete it, you pay them <strong>🪙{challengeReward}</strong> coins.<br/>

          <button disabled={!challengeTask.trim()||challengeReward<1||challengeReward>s.coins} onClick={async()=>{

          }} style={{flex:1,padding:"10px",border:"none",borderRadius:12,fontFamily:"Nunito,sans-serif",fontWeight:900,fontSize:13,background:(!challengeTask.trim()||challengeReward<1||challengeReward>s.coins)?"#E0E0E0":"#5FA0E0",color:(!challengeTask.trim()||challengeReward<1||challengeReward>s.coins)?"#BBB":"#fff",cursor:"pointer"}}>Send! 🎯</button>
        </div>

    {confirmUnfriend&&<div className="ov" onClick={()=>setConfirmUnfriend(null)}>

        <div style={{display:"flex",gap:10}}>
          <button onClick={()=>setConfirmUnfriend(null)} style={{flex:1,padding:"10px",border:"2px solid #E0E0E0",borderRadius:13,fontFamily:"Nunito,sans-serif",fontWeight:800,fontSize:13,background:"#fff",color:"#888",cursor:"pointer"}}>Cancel</button>
          <button onClick={async()=>{

            if(theirSnap.exists()){
              const theirData=theirSnap.val();
              await fbRef("profiles/"+confirmUnfriend.toLowerCase()+"/friends").set((theirData.friends||[]).filter(f=>f.username!==currentUser));
            }

          }} style={{flex:1,padding:"10px",border:"none",borderRadius:13,fontFamily:"Nunito,sans-serif",fontWeight:900,fontSize:13,background:"#E53935",color:"#fff",cursor:"pointer"}}>Remove</button>
        </div>

    {modal==="streak"&&<div className="ov" onClick={e=>e.target===e.currentTarget&&setModal(null)}>
      <div className="box" style={{border:"2.5px solid #FFAB40",width:"95%",maxWidth:360,maxHeight:"88vh",overflowY:"auto"}}>

          <div><div style={{fontSize:16,fontWeight:900,color:"#333"}}>🔥 Streak Milestones</div><div style={{fontSize:11,color:"#999",fontWeight:700,marginTop:2}}>{s.streak}-day streak!</div></div>
          {s.streakFreezes>0&&<button onClick={()=>{upd({streakFreezes:s.streakFreezes-1,lastStreakDate:tod()});showToast("Streak saved! 🧊");}} style={{background:"#E8F3FF",border:"2px solid #5FA0E0",borderRadius:10,padding:"6px 11px",fontSize:11,fontWeight:800,color:"#1565C0",fontFamily:"Nunito,sans-serif",cursor:"pointer"}}>🧊 ({s.streakFreezes})</button>}

        </div>

    {/* Profile edit modal */}
    {modal==="edit"&&<div className="ov" onClick={e=>e.target===e.currentTarget&&setModal(null)}>
      <div className="box" style={{border:"2.5px solid #C8DCF5",maxHeight:"88vh",overflowY:"auto"}}>

        <div style={{fontSize:10,fontWeight:800,color:"#AAA",letterSpacing:".8px",marginBottom:4}}>PICK YOUR AVATAR EMOJI</div>
        <div style={{fontSize:9,color:"#BBB",fontWeight:600,marginBottom:8}}>Buy characters in the Shop to unlock more!</div>
        <div style={{fontSize:10,fontWeight:700,color:"#888",marginBottom:6}}>🆓 Free avatars</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(6,1fr)",gap:6,marginBottom:12}}>

                </div>

              const fmtCountdown=ms=>{if(ms<0)return"OVERDUE";const s2=Math.floor(ms/1000);const h=Math.floor(s2/3600),m=Math.floor((s2%3600)/60),sc=s2%60;return h>0?`${h}h ${m}m`:`${m}m ${sc}s`;};

                </div>
                {hasDue&&!task.done&&<div style={{display:"flex",alignItems:"center",gap:6,padding:"0 15px 9px 55px"}}>
                  <span style={{fontSize:10}}>{overdue?"🔴":urgentSoon?"🟠":"🕐"}</span>
                  <span style={{fontSize:10,fontWeight:800,color:overdue?"#C62828":urgentSoon?"#E65100":"#555",fontFamily:"monospace,sans-serif"}}>{overdue?"OVERDUE":fmtCountdown(msLeft)}</span>

              </div>;

          {/* Stats */}

          {(s.incomingRequests||[]).length>0&&<>

              <FriendCard friend={f} tc={tc} tc2={tc2} cardBg={cardBg} cardBdr={cardBdr}/>
              <div style={{display:"flex",gap:6,marginTop:-4,marginBottom:8,paddingLeft:4}}>
                <button onClick={()=>{(async()=>{const fresh=await getUserFromDb(f.username);if(fresh)upd({friends:s.friends.map(x=>x.username===f.username?fresh:x)});})();}} style={{fontSize:10,fontWeight:800,color:"#5FA0E0",background:"#E8F3FF",border:"1.5px solid #A0C8F0",borderRadius:8,padding:"3px 9px",cursor:"pointer",fontFamily:"Nunito,sans-serif"}}>↻ Refresh</button>
                <button onClick={()=>{setChallengeTarget(f);setChallengeTask("");setChallengeReward(50);setShowChallengeModal(true);}} style={{fontSize:10,fontWeight:800,color:"#FF8C00",background:"#FFF3E0",border:"1.5px solid #FFCC80",borderRadius:8,padding:"3px 9px",cursor:"pointer",fontFamily:"Nunito,sans-serif"}}>🎯 Challenge</button>
                <button onClick={()=>setConfirmUnfriend(f.username)} style={{fontSize:10,fontWeight:800,color:"#E53935",background:"#FFEBEE",border:"1.5px solid #FFCDD2",borderRadius:8,padding:"3px 9px",cursor:"pointer",fontFamily:"Nunito,sans-serif"}}>Remove</button>
              </div>
            </div>)}

          {/* ─── INCOMING CHALLENGES ─── */}
          {(s.challenges||[]).length>0&&<>
            <div style={{height:1,background:cardBdr,margin:"4px 0 12px"}}/>
            <div style={{fontWeight:900,fontSize:14,color:tc,marginBottom:8,display:"flex",alignItems:"center",gap:8}}>
              🎯 Challenges for You
              <span style={{background:"#FF8C00",color:"#fff",borderRadius:20,padding:"2px 9px",fontSize:11,fontWeight:800}}>{(s.challenges||[]).length}</span>
            </div>
            {(s.challenges||[]).map(chal=><div key={chal.id} style={{background:cardBg,border:`2px solid #FFCC80`,borderRadius:18,padding:"13px 14px",marginBottom:10}}>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
                <div style={{width:38,height:38,borderRadius:"50%",background:"#FFF3E0",border:"2px solid #FF8C00",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0}}>{chal.fromAvatar||"🦉"}</div>
                <div style={{flex:1}}>
                  <div style={{fontWeight:800,fontSize:12,color:tc}}>{chal.fromDisplay||chal.from} challenged you!</div>
                  <div style={{fontSize:10,color:"#FF8C00",fontWeight:800,marginTop:1}}>Reward: 🪙 {chal.reward} coins</div>
                </div>
              </div>
              <div style={{background:"#FFF8E8",border:"1.5px solid #FFE0A0",borderRadius:10,padding:"8px 11px",fontSize:12,fontWeight:700,color:"#333",marginBottom:10}}>
                📋 {chal.task}
              </div>
              <div style={{display:"flex",gap:7}}>
                <button onClick={async()=>{
                  await resolveChallenge(chal.id,currentUser,chal.from,chal.reward,true);
                  const newCoins=s.coins+chal.reward;
                  upd({coins:newCoins,challenges:(s.challenges||[]).filter(c=>c.id!==chal.id)});
                  showToast(`+🪙${chal.reward} coins! Challenge complete! 🎉`);
                }} style={{flex:1,padding:"9px",border:"none",borderRadius:11,fontFamily:"Nunito,sans-serif",fontWeight:900,fontSize:12,background:"#5FA0E0",color:"#fff",cursor:"pointer",boxShadow:"0 2px 0 #4A8CC8"}}>✅ Done! (+🪙{chal.reward})</button>
                <button onClick={async()=>{
                  await resolveChallenge(chal.id,currentUser,chal.from,chal.reward,false);
                  upd({challenges:(s.challenges||[]).filter(c=>c.id!==chal.id)});
                  showToast("Challenge declined");
                }} style={{padding:"9px 13px",border:"2px solid #FFCDD2",borderRadius:11,fontFamily:"Nunito,sans-serif",fontWeight:800,fontSize:12,background:"#FFF0F0",color:"#E53935",cursor:"pointer"}}>✗ Decline</button>
              </div>
            </div>)}
          </>}
        </>}

        {tab==="shop"&&<>
          {card(<div style={{padding:"12px 15px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div><div style={{fontWeight:900,fontSize:16,color:tc}}>🛒 Shop</div><div style={{fontSize:11,fontWeight:600,color:tc2,marginTop:1}}>Customise everything!</div></div>
            <div style={{display:"flex",alignItems:"center",gap:5,background:dk?"#1A2030":"#E8F3FF",border:"2px solid #5FA0E0",borderRadius:13,padding:"7px 13px"}}>
              <span style={{fontSize:15}}>🪙</span><span style={{fontWeight:900,fontSize:15,color:"#5FA0E0"}}>{s.coins}</span>
            </div>
          </div>)}
          <div style={{display:"flex",gap:5,marginBottom:12}}>
            {[{id:"chars",l:"🦉 Characters"},{id:"bgs",l:"🎨 Themes"},{id:"frames",l:"🖼 Frames"},{id:"util",l:"⚡ Power-Ups"}].map(t=><button key={t.id} onClick={()=>setShopTab(t.id)} style={{flex:1,padding:"7px 2px",border:`2px solid ${shopTab===t.id?"#5FA0E0":"#E0EAFA"}`,borderRadius:14,fontFamily:"Nunito,sans-serif",fontSize:9,fontWeight:800,cursor:"pointer",color:shopTab===t.id?"#5FA0E0":tc2,background:shopTab===t.id?(dk?"#1A2030":"#E8F3FF"):(dk?"#16162A":"#FAFCFF"),transition:"all .15s"}}>{t.l}</button>)}
          </div>
          {shopTab==="chars"&&<>
            <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:10,marginBottom:12}}>
              {BASE_CHARS.map(c=>{
                const owned=s.ownedChar.includes(c.id);
                const canAfford=s.coins>=c.price;
                return <ShopCard key={c.id} item={c} cat="chars" isEq={s.equippedChar===c.id} owned={owned} canAfford={canAfford} {...th} onClick={()=>{if(!owned&&!canAfford){showToast("Not enough coins! 🔒");return;}requestBuy(c,"chars");}} onSell={owned&&c.price>0?()=>setSellItem({item:c,cat:"chars"}):null}/>;
              })}
            </div>
            <div style={{background:dk?"#1A2030":"#FFF8E8",border:`2px solid #FFCC80`,borderRadius:16,padding:"10px 14px",marginBottom:10}}>
              <div style={{fontWeight:900,fontSize:13,color:"#E65100",marginBottom:4}}>🏆 Tier Reward Characters</div>
              <div style={{fontSize:11,fontWeight:600,color:"#888",marginBottom:10}}>Reach the milestone rank to unlock these exclusive characters!</div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:10}}>
                {TIER_CHARS.map(c=>{
                  const owned=s.ownedChar.includes(c.id);
                  const triggerRank=Object.values(TIER_REWARDS).find(r=>r.char.id===c.id)?.triggerRank||"";
                  return <div key={c.id} style={{background:owned?c.bg:(dk?"#1C1A14":"#FFFBF0"),border:`2px solid ${owned?"#F9A825":"#FFE0A0"}`,borderRadius:16,padding:"12px 8px",textAlign:"center",position:"relative",opacity:owned?1:0.75}}>
                    {!owned&&<div style={{position:"absolute",top:6,right:6,background:"#F9A825",borderRadius:8,padding:"2px 7px",fontSize:9,fontWeight:900,color:"#fff"}}>LOCKED</div>}
                    {owned&&<div style={{position:"absolute",top:6,right:6,background:"#4CAF50",borderRadius:8,padding:"2px 7px",fontSize:9,fontWeight:900,color:"#fff"}}>OWNED</div>}
                    <div style={{width:52,height:52,borderRadius:14,background:c.bg,border:`2.5px solid ${c.bdr}`,margin:"0 auto 8px",display:"flex",alignItems:"center",justifyContent:"center",fontSize:28}}>{c.ico}</div>
                    <div style={{fontWeight:800,fontSize:12,color:dk?"#E0D8C0":"#333"}}>{c.name}</div>
                    <div style={{fontSize:9,fontWeight:700,color:"#F9A825",marginTop:2}}>Reach: {triggerRank}</div>
                    {owned&&<div onClick={()=>requestBuy(c,"chars")} style={{marginTop:7,borderRadius:9,padding:"6px",fontSize:10,fontWeight:800,background:s.equippedChar===c.id?"#5FA0E0":"#DBEAFE",color:s.equippedChar===c.id?"#fff":"#1D4ED8",cursor:"pointer"}}>{s.equippedChar===c.id?"✓ Equipped":"Equip"}</div>}
                  </div>;
                })}
              </div>
            </div>
          </>}
          {shopTab==="bgs"&&<div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:10}}>
            {BGS.map(c=>{
              const owned=s.ownedBg.includes(c.id);
              const isTierLocked=c.tierReward&&!owned;
              return <ShopCard key={c.id} item={c} cat="bgs" isEq={s.equippedBg===c.id} owned={owned} canAfford={s.coins>=c.price} {...th} onClick={()=>{if(isTierLocked){showToast("Unlock by reaching that rank! 🏆");return;}if(!owned&&s.coins<c.price&&!c.tierReward){showToast("Not enough coins! 🔒");return;}requestBuy(c,"bgs");}} onSell={owned&&c.price>0&&!c.tierReward?()=>setSellItem({item:c,cat:"bgs"}):null}/>;
            })}
          </div>}
          {shopTab==="frames"&&<div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:10}}>
            {FRAMES.map(c=>{const ownedFr=s.ownedFrame.includes(c.id);return <ShopCard key={c.id} item={c} cat="frames" isEq={s.equippedFrame===c.id} owned={ownedFr} canAfford={s.coins>=c.price} {...th} onClick={()=>{if(!ownedFr&&s.coins<c.price){showToast("Not enough coins! 🔒");return;}requestBuy(c,"frames");}} onSell={ownedFr&&c.price>0?()=>setSellItem({item:c,cat:"frames"}):null}/>;})}
          </div>}
          {shopTab==="util"&&<div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:10}}>
            {UTILS.map(u=>{
              const can=s.coins>=u.price;
              const qty=u.id==="freeze"?s.streakFreezes:u.id==="xp_boost"?s.xpBoost:u.id==="xp_cap"?s.xpCapBonuses:0;
              return <div key={u.id} onClick={()=>requestBuy(u,"util")} style={{background:dk?"#1A1A28":"#fff",border:`2.5px solid ${dk?cardBdr:"#E0EAFA"}`,borderRadius:20,padding:"14px 10px",textAlign:"center",cursor:"pointer",transition:"transform .15s"}}
                onMouseEnter={e=>e.currentTarget.style.transform="translateY(-3px)"}
                onMouseLeave={e=>e.currentTarget.style.transform="none"}>
                <div style={{width:54,height:54,borderRadius:16,background:u.bg,border:`2.5px solid ${u.bdr}`,margin:"0 auto 9px",display:"flex",alignItems:"center",justifyContent:"center",fontSize:26}}>{u.ico}</div>
                <div style={{fontWeight:800,fontSize:12,color:tc}}>{u.name}</div>
                <div style={{fontSize:10,color:tc2,fontWeight:600,margin:"3px 0 5px"}}>{u.desc}</div>
                {u.id!=="chest_key"&&qty>0&&<div style={{fontSize:10,fontWeight:800,color:u.bdr,marginBottom:5,padding:"2px 8px",borderRadius:20,background:u.bg,display:"inline-block"}}>Have: {qty}</div>}
                <div style={{marginTop:4,borderRadius:10,padding:"7px 6px",fontSize:11,fontWeight:800,background:can?"#5FA0E0":"#F3F4F6",color:can?"#fff":"#BBB",boxShadow:can?"0 3px 0 #4A8CC8":"none"}}>{can?`🪙 ${u.price}`:`🔒 ${u.price}`}</div>
              </div>;
            })}
          </div>}
        </>}

        {tab==="profile"&&<>
          {card(<div style={{padding:"20px 16px",textAlign:"center"}}>
            <div style={{position:"relative",width:78,height:78,margin:"0 auto 12px"}}>
              <div style={{width:78,height:78,borderRadius:"50%",background:eqChar.bg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:36,...frameStyle}}>{s.avatar}</div>
              <div onClick={()=>{setEditName(s.displayName||s.username);setSelAv(s.avatar);setModal("edit");}} style={{position:"absolute",bottom:1,right:1,width:24,height:24,borderRadius:"50%",background:"#5FA0E0",border:"2.5px solid #fff",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,cursor:"pointer",color:"#fff",fontWeight:900}}>✎</div>
            </div>
            <div style={{fontWeight:900,fontSize:20,color:tc}}>{s.displayName||s.username}</div>
            <div style={{fontSize:11,fontWeight:700,color:tc2,marginTop:2}}>@{s.username}</div>
            <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:5,marginTop:5}}><span style={{fontSize:18}}>{rank.icon}</span><span style={{fontSize:13,fontWeight:800,color:rank.col}}>{rank.name}</span></div>
            <div style={{display:"flex",justifyContent:"center",gap:20,marginTop:14,paddingTop:14,borderTop:`2px solid ${innerBdr}`}}>
              {[{v:s.xp.toLocaleString(),l:"XP",c:"#1565C0"},{v:s.streak,l:"STREAK",c:"#E65100"},{v:s.totalDone,l:"DONE",c:"#2E7D32"}].map(st=><div key={st.l} style={{textAlign:"center"}}><div style={{fontWeight:900,fontSize:20,color:st.c}}>{st.v}</div><div style={{fontSize:9,fontWeight:800,color:tc2,letterSpacing:".7px",marginTop:2}}>{st.l}</div></div>)}
            </div>
            <div style={{marginTop:6}}>
              <div style={{fontSize:11,fontWeight:700,color:tc2,marginBottom:4}}>🏆 Tier Rewards Earned: {(s.claimedTierRewards||[]).length}/6</div>
            </div>
            <button onClick={logout} style={{marginTop:12,background:"#FFF0F0",border:"2px solid #FFCDD2",borderRadius:12,padding:"7px 18px",fontFamily:"Nunito,sans-serif",fontWeight:800,fontSize:12,color:"#E53935",cursor:"pointer"}}>Log Out</button>
          </div>)}

          <div style={{fontSize:10,fontWeight:800,color:tc2,letterSpacing:"1px",marginBottom:9,paddingLeft:2}}>🏅 RANK LADDER</div>
          {card(<>
            {RANKS.map((r,i)=>{
              const unlocked=s.xp>=r.xpReq,isCur=r.name===rank.name;
              const tierEnd=Object.values(TIER_REWARDS).find(tr=>tr.triggerRank===r.name);
              return <div key={r.name} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 15px",borderBottom:i<RANKS.length-1?`2px solid ${innerBdr}`:"none",background:isCur?(dk?"#0E1820":r.lt+"88"):"transparent"}}>
                <div style={{width:38,height:38,borderRadius:12,background:unlocked?r.col+"22":"#F5F5F5",border:`2px solid ${unlocked?r.col+"66":"#EEE"}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}}>{unlocked?r.icon:"🔒"}</div>
                <div style={{flex:1}}>
                  <div style={{fontWeight:800,fontSize:13,color:unlocked?tc:tc2}}>{r.name}</div>
                  <div style={{fontSize:10,color:tc2,fontWeight:600,marginTop:1}}>{r.xpReq.toLocaleString()} XP{tierEnd?<span style={{marginLeft:6,color:"#F9A825",fontWeight:800}}>🎁 Tier Reward!</span>:""}</div>
                </div>
                {isCur&&<span style={{background:"#E8F3FF",color:"#5FA0E0",border:"1.5px solid #A0C8F0",padding:"2px 8px",borderRadius:20,fontSize:10,fontWeight:800}}>NOW</span>}
                {unlocked&&!isCur&&<span style={{fontSize:12}}>✅</span>}
              </div>;
            })}
          </>)}
        </>}
      </div>
    </div>

    {/* ─── BOTTOM NAV ─── */}
    <div style={{flexShrink:0,background:bg.hdr,borderTop:`2.5px solid ${cardBdr}`,position:"relative",zIndex:2,display:"flex",padding:"4px 0 2px"}}>
      {[{id:"home",l:"HOME",ico:"🏠"},{id:"quests",l:"QUESTS",ico:"🎯"},{id:"friends",l:"FRIENDS",ico:"👥"},{id:"shop",l:"SHOP",ico:"🛒"},{id:"profile",l:"ME",ico:"👤"}].map(t=><button key={t.id} className="nb" onClick={()=>setTab(t.id)} style={{flex:1}}>
        <span style={{fontSize:tab===t.id?20:17,display:"block",transform:tab===t.id?"scale(1.2)":"none",transition:"transform .2s"}}>{t.ico}</span>
        <span style={{fontSize:8,fontWeight:800,letterSpacing:".5px",color:tab===t.id?"#5FA0E0":tc2}}>{t.l}</span>
        {tab===t.id&&<div style={{position:"absolute",bottom:0,left:"50%",transform:"translateX(-50%)",width:18,height:3,background:"#5FA0E0",borderRadius:"3px 3px 0 0"}}/>}
      </button>)}
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
